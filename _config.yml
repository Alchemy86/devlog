# The devlog is a plain Jekyll site: GitHub Pages builds it on push, so writing
# a post is dropping a markdown file into _posts/ and nothing else.

title: devlog
description: The captain's engineering log.
repository: Alchemy86/devlog
url: https://alchemy86.github.io
baseurl: /devlog
title_suffix: " — devlog"

# Colour palette. One of the names in _data/palettes.yml:
# devlog (the default), midnight, terminal, press.
palette: devlog
timezone: Etc/UTC

# A post you committed is a post you meant to publish. Without this, a file dated
# even a day ahead is silently dropped from the build with no error.
future: true

# Keeps every URL the hand-written site already published: /posts/<slug>.html
permalink: /posts/:title.html

# Discoverability. Both are on GitHub Pages' own plugin allowlist (github-pages 232,
# GitHubPages::Plugins::PLUGIN_WHITELIST), so Pages loads them without a workflow.
# Each only adds files - sitemap.xml and feed.xml - and neither touches a page's markup.
# jekyll-seo-tag is allowlisted too but is deliberately not here: see README.md.
plugins:
  - jekyll-sitemap
  - jekyll-feed

# jekyll-feed ships ten entries by default. Eighteen of the posts here share a single
# date, so ten would hand a new subscriber the last two days and hide the rest of the
# log. Carry all of it: the whole feed is a few hundred KB, fetched once.
feed:
  posts_limit: 100

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# The pages carry their own hand-set typography and entities. Leave both alone:
# no generated heading ids, no curled quotes, no dashes rewritten under us.
kramdown:
  auto_ids: false
  # No Rouge: it stamps language-plaintext/highlighter-rouge classes onto every
  # code span and re-wraps fenced blocks in two extra divs.
  syntax_highlighter: ~
  smart_quotes: ["apos", "apos", "quot", "quot"]
  typographic_symbols:
    ndash: "--"
    mdash: "---"
    hellip: "..."

# No theme: the design system is assets/css/main.css and nothing else. Without this
# the default Pages theme ships an unused 2,900-line stylesheet into the output.
theme:

exclude:
  - README.md
  # The brand generator and its previews are how the mark is made, not a page
  # on the site. The site serves its own copies out of assets/img/brand/.
  - docs
  # A build note that lives next to the footage it describes, not a page.
  - assets/video/asciiworldengine/lift-ride.assets.md
  - AGENTS.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor

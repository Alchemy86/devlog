# Named colour palettes. Pick one with `palette: <name>` in _config.yml.
#
# Each has a full light and dark set - the site follows the reader's system
# setting, so a palette that only works in one of them is a broken palette.
# Every accent and secondary text colour here clears WCAG AA (4.5:1) against
# its own background in both modes.
#
# Adding one: copy a block, rename it, change the ten values. Nothing else in
# the site needs to know about it.

# The devlog's own look: warm paper, white cards, one burnt-amber accent.
devlog:
  note: burnt amber, used sparingly
  light:
    paper:      "#F3F5EE"
    card:       "#FFFFFF"
    ink:        "#14170F"
    ink-soft:   "#565C4E"
    hairline:   "#DDE1D4"
    hairline-2: "#E9ECE2"
    accent:     "#A8431F"
    accent-dim: "#B4552A"
    code-bg:    "#F5F6F0"
    shadow:     "0 1px 2px rgba(20, 23, 15, .04), 0 8px 24px rgba(20, 23, 15, .05)"
  dark:
    paper:      "#12140E"
    card:       "#1A1D15"
    ink:        "#ECEFE4"
    ink-soft:   "#9BA290"
    hairline:   "#2C3124"
    hairline-2: "#23271C"
    accent:     "#E6935F"
    accent-dim: "#D8824C"
    code-bg:    "#1E2118"
    shadow:     "0 1px 2px rgba(0, 0, 0, .25), 0 8px 24px rgba(0, 0, 0, .30)"

